<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ders Takip</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Ders Takip">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5b5bf0">
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1b1d29;--mut:#6b7185;--ac:#5b5bf0;--ac2:#e9e9ff;--ok:#18a05e;--bd:#e3e5ee;--red:#e5484d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131a;--card:#1c1e2a;--tx:#eef0f8;--mut:#9aa0b8;--ac:#8484ff;--ac2:#2a2b45;--bd:#2c2f40;--red:#ff6b70;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;max-width:520px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:6px 0 14px}
h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.time{font-size:54px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600}
button.big{width:100%;padding:16px;font-size:17px}
button.stop{background:var(--red)}
button.ghost{background:var(--ac2);color:var(--ac)}
button.x{background:none;color:var(--mut);padding:4px 8px}
input[type=text]{font:inherit;width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:var(--ac2);color:var(--ac);padding:10px 14px;border-radius:20px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);max-width:520px;margin:0 auto}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 4px;font-size:13px}
nav button.on{color:var(--ac)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet .box{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.day{border-top:1px solid var(--bd);padding:10px 0}
.day:first-child{border-top:0}
.day.today h3{color:var(--ac)}
.day h3{font-size:14px;margin:0 0 6px;display:flex;justify-content:space-between}
.day h3 span{color:var(--mut);font-weight:500}
.task{display:flex;align-items:center;gap:8px;padding:4px 0}
.task input{width:20px;height:20px}
.task.d label{text-decoration:line-through;color:var(--mut)}
.task label{flex:1}
.bars{display:flex;gap:6px;align-items:flex-end;height:110px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.bar i{display:block;width:100%;background:var(--ac);border-radius:6px 6px 0 0;min-height:2px}
.srow{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--bd)}
.srow:first-of-type{border-top:0}
.mut{color:var(--mut);font-size:13px}
#cv{width:100%;height:360px;background:#fff;border:1px solid var(--bd);border-radius:12px;touch-action:none;display:block;-webkit-user-select:none;user-select:none}
.sw{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid var(--bd)}
.sw.on{border-color:var(--ac)}
.nimg{width:100%;border-radius:10px;border:1px solid var(--bd);background:#fff}
.chip.sel{background:var(--ac);color:#fff}
.cp{width:34px;height:34px;padding:0;border:0;background:none}
.ngrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ncard{border:1px solid var(--bd);border-radius:12px;padding:8px;font-size:13px}
.ncov{height:70px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:6px}
.sheet .box{max-height:90vh;overflow:auto}
.card.fs{position:fixed;inset:0;z-index:20;margin:0;border-radius:0;border:0;overflow:auto;background:var(--bg);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
@media (min-width:768px){body{max-width:1000px}nav{max-width:1000px}.sheet .box{max-width:700px}.ngrid{grid-template-columns:repeat(4,1fr)}}
.ed{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.tb{display:flex;gap:6px;align-items:center;padding:8px;overflow-x:auto;flex:none;background:var(--card);border-bottom:1px solid var(--bd)}
.tb>*{flex:none}
.tb .sw{width:28px;height:28px}
.tb select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.ib{padding:8px 12px;background:var(--ac2);color:var(--ac);font-size:18px}
.ib.sel{background:var(--ac);color:#fff}
.cvw{flex:1;position:relative;min-height:0}
.cvw #cv{position:absolute;left:0;top:0;width:100%;height:100%;border:0;border-radius:0}
.tt{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
.sheet{z-index:40}
.cvw #ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.pn{font-size:13px;color:var(--mut);padding:0 2px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="modal"></div>
<script>
var KEY='dersTakip1';
var DAYS=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
var S=load(),tab='timer',tick=null;
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d)return d}catch(e){}
return{name:'',subjects:['Matematik','Fizik','Kimya','Türkçe'],sessions:[],plan:{},run:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ds(d){var m=d.getMonth()+1,g=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(g<10?'0':'')+g}
function weekDates(){var n=new Date(),w=(n.getDay()+6)%7,a=[];for(var i=0;i<7;i++){var d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-w+i);a.push(ds(d))}return a}
function fmt(s){s=Math.floor(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return h+':'+(m<10?'0':'')+m+':'+(c<10?'0':'')+c}
function short(s){var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+' sa '+m+' dk':m+' dk'}
function dayTotal(k){return S.sessions.filter(function(x){return x.day===k}).reduce(function(a,x){return a+x.d},0)}
function elapsed(){return S.run?(Date.now()-S.run.start)/1000:0}

function render(){
 var h='';
 if(tab==='timer'){
  h+='<h1>'+(S.name?'Selam '+esc(S.name)+' 👋':'Ders Takip')+'</h1>';
  h+='<div class="card"><div class="time" id="t">'+fmt(elapsed())+'</div>';
  h+=S.run?'<button class="big stop" onclick="stop()">Durdur</button>':'<button class="big" onclick="start()">Çalışmaya başla</button>';
  h+='</div>';
  var today=ds(new Date()),map={};
  S.sessions.filter(function(x){return x.day===today}).forEach(function(x){map[x.s]=(map[x.s]||0)+x.d});
  h+='<div class="card"><h2>Bugün: '+short(dayTotal(today))+'</h2>';
  var any=false;
  S.sessions.forEach(function(x,i){if(x.day!==today)return;any=true;
   h+='<div class="srow"><span>'+(x.s?esc(x.s):'<i class="mut">Ders yazılmadı</i>')+'</span><span><b>'+fmt(x.d)+'</b> <button class="ghost" style="padding:6px 10px" onclick="editS('+i+')">'+(x.s?'Değiştir':'Ders yaz')+'</button></span></div>'});
  if(!any)h+='<div class="mut">Henüz kayıt yok.</div>';
  h+='</div>';
 }
 if(tab==='plan'){
  h+='<h1>Haftalık plan</h1><div class="card">';
  var wd=weekDates(),td=ds(new Date());
  wd.forEach(function(k,i){
   var L=S.plan[k]||[];
   h+='<div class="day'+(k===td?' today':'')+'"><h3>'+DAYS[i]+'<span>'+(dayTotal(k)?short(dayTotal(k)):'')+'</span></h3>';
   L.forEach(function(t,j){h+='<div class="task'+(t.d?' d':'')+'"><input type="checkbox" id="c'+i+'_'+j+'" '+(t.d?'checked':'')+' onchange="tog(\''+k+'\','+j+')"><label for="c'+i+'_'+j+'">'+esc(t.t)+'</label><button class="x" onclick="del(\''+k+'\','+j+')">✕</button></div>'});
   h+='<div class="row" style="margin-top:6px"><input type="text" id="n'+i+'" placeholder="Yapılacak ekle..." onkeydown="if(event.key===\'Enter\')add(\''+k+'\','+i+')"><button class="ghost" onclick="add(\''+k+'\','+i+')">+</button></div></div>';
  });
  h+='</div>';
 }
 if(tab==='me'){
  h+='<h1>Profil</h1><div class="card"><h2>Adın</h2><div class="row"><input type="text" id="nm" value="'+esc(S.name)+'" placeholder="Adını yaz"><button class="ghost" onclick="setName()">Kaydet</button></div></div>';
  var wd2=weekDates(),vals=wd2.map(dayTotal),mx=Math.max.apply(null,vals.concat([1])),tot=vals.reduce(function(a,b){return a+b},0);
  h+='<div class="card"><h2>Bu hafta: '+short(tot)+'</h2><div class="bars">';
  vals.forEach(function(v,i){h+='<div class="bar"><span>'+(v?Math.round(v/360)/10+'s':'')+'</span><i style="height:'+Math.round(v/mx*80)+'%"></i><span>'+DAYS[i].slice(0,3)+'</span></div>'});
  h+='</div></div>';
  var sm={};S.sessions.filter(function(x){return wd2.indexOf(x.day)>-1}).forEach(function(x){var q=x.s||'Ders yazılmadı';sm[q]=(sm[q]||0)+x.d});
  h+='<div class="card"><h2>Derslere göre (bu hafta)</h2>';
  var k2=Object.keys(sm);if(!k2.length)h+='<div class="mut">Henüz kayıt yok.</div>';
  k2.forEach(function(k){h+='<div class="srow"><span>'+esc(k)+'</span><b>'+short(sm[k])+'</b></div>'});
  h+='</div>';
 }
 if(tab==='notes')h+=notesHTML();
 document.getElementById('app').innerHTML=h;
 if(tab==='notes')initCanvas();
 var n='';[['timer','⏱️','Kronometre'],['plan','📅','Plan'],['notes','✏️','Notlar'],['me','👤','Profil']].forEach(function(x){n+='<button class="'+(tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'<br>'+x[2]+'</button>'});
 document.getElementById('nav').innerHTML=n;
}
function go(t){tab=t;render()}
function start(){S.run={start:Date.now()};save();render()}
function stop(){record('')}
function editS(i){
 var x=S.sessions[i];
 var m='<div class="sheet"><div class="box"><h2>Bu süre ne için? ('+fmt(x.d)+')</h2><div class="chips">';
 S.subjects.forEach(function(s,j){m+='<button class="chip" onclick="setS('+i+','+j+')">'+esc(s)+'</button>'});
 m+='</div><div class="row"><input type="text" id="ns" placeholder="Dersi kendin yaz"><button onclick="setNew('+i+')">Kaydet</button></div>';
 m+='<div class="row" style="margin-top:10px"><button class="ghost big" onclick="closeM()">Kapat</button><button class="ghost big" style="color:var(--red)" onclick="delS('+i+')">Sil</button></div></div></div>';
 document.getElementById('modal').innerHTML=m;
}
function setS(i,j){S.sessions[i].s=S.subjects[j];save();closeM();render()}
function setNew(i){var v=document.getElementById('ns').value.trim();if(!v)return;if(S.subjects.indexOf(v)<0)S.subjects.push(v);S.sessions[i].s=v;save();closeM();render()}
function delS(i){S.sessions.splice(i,1);save();closeM();render()}
function closeM(){document.getElementById('modal').innerHTML=''}
function record(name){
 var d=Math.round(elapsed());
 if(d>=1)S.sessions.push({s:name,d:d,day:ds(new Date(S.run.start))});
 S.run=null;save();closeM();render();
}
function finish(i){record(S.subjects[i])}
function finishNew(){var v=document.getElementById('ns').value.trim();if(!v)return;if(S.subjects.indexOf(v)<0)S.subjects.push(v);record(v)}
function add(k,i){var el=document.getElementById('n'+i),v=el.value.trim();if(!v)return;(S.plan[k]=S.plan[k]||[]).push({t:v,d:false});save();render()}
function tog(k,j){S.plan[k][j].d=!S.plan[k][j].d;save();render()}
function del(k,j){S.plan[k].splice(j,1);save();render()}
function setName(){S.name=document.getElementById('nm').value.trim();save();render()}
var pen={t:'pen',c:'#1b1d29',w:3,only:false,paper:'plain'},strokes=[],cur=null,snap=null,cv,ctx,DPR=1,ntv='',ncat='',ncov='#5b5bf0',nemo='📘',ncimg='',nfil='',CW=0,CH=520,ed=false,PW=800,PH=1600,V={k:1,x:0,y:0},K0=1,ptrs={},gest=null,penSeen=false,lastPen=0,hold=null;
var COLS=['#1b1d29','#e5484d','#f08a24','#e6c200','#18a05e','#2f6fed','#8a4bd8','#e84a9c'];
var COVS=['#5b5bf0','#e5484d','#f08a24','#18a05e','#2f6fed','#8a4bd8'];
var EMOS=['📘','📗','📕','✏️','🧮','🧪','📐','🌍'];
function coverUI(i){
 var c=i<0?ncov:S.notes[i].cov,e=i<0?nemo:S.notes[i].emo,h='<div class="row" style="flex-wrap:wrap;margin:6px 0">';
 COVS.forEach(function(x){h+='<button class="sw'+(c===x?' on':'')+'" style="background:'+x+'" data-c="'+x+'" onclick="setCov('+i+',this.dataset.c)"></button>'});
 h+='</div><div class="chips" style="margin:6px 0">';
 EMOS.forEach(function(x){h+='<button class="chip'+(e===x?' sel':'')+'" data-e="'+x+'" onclick="setEmo('+i+',this.dataset.e)">'+x+'</button>'});
 return h+'<button class="chip" onclick="document.getElementById(\'cf'+i+'\').click()">📷 Fotoğraf</button></div><input type="file" accept="image/*" id="cf'+i+'" hidden onchange="pickCov('+i+',this)">';
}
function setCov(i,c){if(i<0){ncov=c;ncimg='';saveDlg()}else{S.notes[i].cov=c;S.notes[i].ci='';save();render();openNote(i)}}
function setEmo(i,e){if(i<0){nemo=e;saveDlg()}else{S.notes[i].emo=e;save();render();openNote(i)}}
function pickCov(i,inp){var f=inp.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=320;c.height=200;var g=c.getContext('2d'),s=Math.max(320/im.width,200/im.height),w=im.width*s,h=im.height*s;g.drawImage(im,(320-w)/2,(200-h)/2,w,h);var d=c.toDataURL('image/jpeg',0.75);if(i<0){ncimg=d;saveDlg()}else{S.notes[i].ci=d;save();render();openNote(i)}};im.src=fr.result};fr.readAsDataURL(f)}
function notesHTML(){return ed?editorHTML():libHTML()}
function libHTML(){
 var h='<h1>Notlar</h1><button class="big" onclick="newNote()">✏️ Yeni not yaz</button><div class="card" style="margin-top:12px"><div class="chips" style="margin-top:0">';
 [''].concat(S.subjects).forEach(function(s){h+='<button class="chip'+(nfil===s?' sel':'')+'" data-s="'+esc(s)+'" onclick="nfil=this.dataset.s;render()">'+(s?esc(s):'Tümü')+'</button>'});
 h+='</div>';
 var L=(S.notes||[]).map(function(n,i){return{n:n,i:i}}).filter(function(o){return !nfil||o.n.cat===nfil});
 if(!L.length)h+='<div class="mut">Burada henüz not yok.</div>';
 h+='<div class="ngrid">';
 L.forEach(function(o){var n=o.n;h+='<div class="ncard" onclick="openNote('+o.i+')">'+(n.ci?'<div class="ncov" style="background:url(\''+n.ci+'\') center/cover"></div>':'<div class="ncov" style="background:'+(n.cov||'#5b5bf0')+'">'+(n.emo||'📘')+'</div>')+'<b>'+esc(n.title)+'</b><div class="mut">'+(n.cat?esc(n.cat)+' · ':'')+new Date(n.t).toLocaleDateString('tr-TR')+'</div></div>'});
 return h+'</div></div>';
}
function editorHTML(){
 var h='<div class="ed"><div class="tb"><button class="ib" onclick="leave()">✕</button>';
 h+='<button class="ib" onclick="goPage(-1)">◀</button><span class="pn">'+(pi+1)+'/'+pages.length+'</span><button class="ib" onclick="goPage(1)">▶</button><button class="ib" onclick="addPage()">＋📄</button>';
 Object.keys(TOOLS).forEach(function(k){h+='<button class="ib'+(pen.t===k?' sel':'')+'" title="'+TOOLS[k].n+'" data-t="'+k+'" onclick="setT(this.dataset.t)">'+TOOLS[k].n.split(' ')[0]+'</button>'});
 COLS.forEach(function(c){h+='<button class="sw'+(pen.c===c&&pen.t!=='er'?' on':'')+'" style="background:'+c+'" data-c="'+c+'" onclick="setC(this.dataset.c)"></button>'});
 h+='<input type="color" class="cp" value="'+pen.c+'" onchange="setC(this.value)"><input type="range" min="1" max="24" value="'+pen.w+'" oninput="pen.w=+this.value" style="width:90px">';
 h+='<select onchange="setP(this.value)">'+PAPERS.map(function(x){return'<option value="'+x[0]+'"'+(pen.paper===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select>';
 h+='<button class="ib" onclick="undo()">↶</button><button class="ib" onclick="zoomBy(1.4)">＋</button><button class="ib" onclick="zoomBy(1/1.4)">－</button><button class="ib" onclick="fitV()">⤢</button><button class="ib" onclick="clr()">🗑️</button><button class="ib" style="background:var(--ok);color:#fff" onclick="if(editIdx<0)saveDlg();else saveNote()">Kaydet</button></div>';
 return h+'<div class="cvw"><canvas id="cv"></canvas><canvas id="ov"></canvas><div id="tt" class="tt"></div></div></div>';
}
function rr(){var t=document.querySelector('.tb'),sl=t?t.scrollLeft:0;render();t=document.querySelector('.tb');if(t)t.scrollLeft=sl}
function setT(t){pen.t=t;rr()}
function setC(c){pen.c=c;if(pen.t==='er')pen.t='pen';rr()}
function setP(p){pen.paper=p;rr()}
var pages=[],pi=0,editIdx=-1,ov,octx;
function newNote(){ed=true;editIdx=-1;strokes=[];pages=[{s:strokes,p:pen.paper}];pi=0;V.cw=0;render()}
function leave(){curPage();if(pages.some(function(p){return p.s.length})&&!confirm('Kaydedilmemiş not silinecek. Çıkılsın mı?'))return;strokes=[];pages=[];pi=0;editIdx=-1;ed=false;render()}
function saveDlg(){
 var h='<div class="sheet"><div class="box"><h2>Notu kaydet</h2><input type="text" placeholder="Not başlığı" value="'+esc(ntv)+'" oninput="ntv=this.value"><div class="mut" style="margin-top:10px">Kategori</div><div class="chips" style="margin:6px 0">';
 S.subjects.forEach(function(s){h+='<button class="chip'+(ncat===s?' sel':'')+'" data-s="'+esc(s)+'" onclick="ncat=this.dataset.s;saveDlg()">'+esc(s)+'</button>'});
 h+='<button class="chip" onclick="newCat()">+ Yeni</button></div><div class="mut">Kapak'+(ncimg?' (fotoğraf seçili)':'')+'</div>'+coverUI(-1)+'<div class="row" style="margin-top:10px"><button class="ghost big" onclick="closeM()">Vazgeç</button><button class="big" onclick="saveNote()">Kaydet</button></div></div></div>';
 document.getElementById('modal').innerHTML=h;
}
function newCat(){var v=prompt('Yeni kategori adı');if(!v)return;v=v.trim();if(!v)return;if(S.subjects.indexOf(v)<0){S.subjects.push(v);save()}ncat=v;saveDlg()}
function undo(){strokes.pop();redraw()}
function clr(){if(strokes.length&&!confirm('Sayfa temizlensin mi?'))return;strokes=[];redraw()}
var TOOLS={pen:{n:'🖊️ Kalem',m:1,a:1,pr:.8},ball:{n:'✒️ Tükenmez',m:.6,a:1,pr:.15},pencil:{n:'✏️ Kurşun',m:.9,a:.6,pr:0,f:1},brush:{n:'🖌️ Fırça',m:2.2,a:1,pr:1.3},hl:{n:'🖍️ Fosforlu',m:1,a:.35,pr:0,f:1},er:{n:'🧽 Silgi',m:1,a:1,pr:0}};
var PAPERS=[['plain','Boş'],['lined','Çizgili'],['grid','Kareli'],['dots','Noktalı'],['cornell','Cornell'],['todo','Yapılacaklar'],['weekly','Haftalık']];
function paper(){
 var P=pen.paper,x,y,i,D=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
 ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(0,0,PW,PH);
 if(P==='plain')return;
 ctx.strokeStyle='#d5d9e8';ctx.fillStyle='#d5d9e8';ctx.lineWidth=1.5;ctx.beginPath();
 if(P==='lined')for(y=40;y<PH;y+=40){ctx.moveTo(0,y);ctx.lineTo(PW,y)}
 if(P==='grid'){for(y=40;y<PH;y+=40){ctx.moveTo(0,y);ctx.lineTo(PW,y)}for(x=40;x<PW;x+=40){ctx.moveTo(x,0);ctx.lineTo(x,PH)}}
 if(P==='cornell')for(y=40;y<PH-240;y+=40){ctx.moveTo(220,y);ctx.lineTo(PW,y)}
 if(P==='todo')for(y=80;y<PH;y+=56){ctx.moveTo(90,y);ctx.lineTo(PW-30,y);ctx.rect(30,y-34,32,32)}
 if(P==='weekly')for(i=0;i<7;i++){y=60+i*220;ctx.moveTo(0,y);ctx.lineTo(PW,y)}
 ctx.stroke();
 if(P==='dots')for(y=40;y<PH;y+=40)for(x=40;x<PW;x+=40)ctx.fillRect(x-2,y-2,4,4);
 if(P==='cornell'){ctx.strokeStyle='#9aa0bd';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(220,0);ctx.lineTo(220,PH-240);ctx.moveTo(0,PH-240);ctx.lineTo(PW,PH-240);ctx.stroke()}
 if(P==='weekly'){ctx.fillStyle='#8a90ad';ctx.font='bold 26px sans-serif';for(i=0;i<7;i++)ctx.fillText(D[i],20,96+i*220)}
}

function style(s){ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=(TOOLS[s.t]||TOOLS.pen).a;ctx.strokeStyle=s.c}
function mid(a,b){return[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2]}
function wd(s,pr){var T=TOOLS[s.t]||TOOLS.pen;return s.w*T.m*(1-T.pr/2+pr*T.pr)}
function seg(s,i){
 style(s);var P=s.p,a,b,c;ctx.beginPath();
 if(P.length===1){a=P[0];ctx.lineWidth=wd(s,a[2]);ctx.moveTo(a[0],a[1]);ctx.lineTo(a[0]+0.01,a[1])}
 else if(i===1){a=P[0];b=mid(P[0],P[1]);ctx.lineWidth=wd(s,a[2]);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}
 else{a=mid(P[i-2],P[i-1]);c=P[i-1];b=mid(c,P[i]);ctx.lineWidth=wd(s,c[2]);ctx.moveTo(a[0],a[1]);ctx.quadraticCurveTo(c[0],c[1],b[0],b[1])}
 ctx.stroke();ctx.globalAlpha=1}
function tail(s){var P=s.p,n=P.length;if(n<2)return;style(s);var a=mid(P[n-2],P[n-1]),b=P[n-1];ctx.lineWidth=wd(s,b[2]);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.globalAlpha=1}
function full(s,g){
 var h=g||ctx,P=s.p,T=TOOLS[s.t];h.globalAlpha=g?1:T.a;h.strokeStyle=s.c;h.lineJoin='round';h.lineCap=s.t==='hl'?'butt':'round';h.lineWidth=s.t==='hl'?s.w*3+12:s.w*T.m;
 h.beginPath();h.moveTo(P[0][0],P[0][1]);
 if(P.length===1)h.lineTo(P[0][0]+0.01,P[0][1]);
 for(var i=1;i<P.length-1;i++){var m=mid(P[i],P[i+1]);h.quadraticCurveTo(P[i][0],P[i][1],m[0],m[1])}
 if(P.length>1)h.lineTo(P[P.length-1][0],P[P.length-1][1]);
 h.stroke();h.globalAlpha=1}
function drawAll(){paper();strokes.forEach(function(s){if((TOOLS[s.t]||{}).f)full(s);else{if(s.p.length===1)seg(s,0);for(var i=1;i<s.p.length;i++)seg(s,i);tail(s)}})}
function ovClear(){if(!octx)return;octx.save();octx.setTransform(1,0,0,1,0,0);octx.clearRect(0,0,ov.width,ov.height);octx.restore()}
function redraw(){if(!ctx)return;ovClear();if(octx)octx.setTransform(DPR*V.k,0,0,DPR*V.k,DPR*V.x,DPR*V.y);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.fillStyle='#cfd3e0';ctx.fillRect(0,0,CW,CH);ctx.setTransform(DPR*V.k,0,0,DPR*V.k,DPR*V.x,DPR*V.y);drawAll()}
function erase(q){var r=pen.w*4+16,n=strokes.length;strokes=strokes.filter(function(s){return !s.p.some(function(p){var dx=p[0]-q[0],dy=p[1]-q[1];return dx*dx+dy*dy<r*r})});if(strokes.length!==n)redraw()}
function clampV(){V.k=Math.min(Math.max(V.k,K0*0.5),K0*8);var w=PW*V.k,h=PH*V.k;V.x=Math.min(Math.max(V.x,Math.min(0,CW-w)-60),Math.max(0,CW-w)+60);V.y=Math.min(Math.max(V.y,Math.min(0,CH-h)-60),Math.max(0,CH-h)+60)}
function zoomBy(f){var cx=CW/2,cy=CH/2,px=(cx-V.x)/V.k,py=(cy-V.y)/V.k;V.k*=f;clampV();V.x=cx-px*V.k;V.y=cy-py*V.k;clampV();redraw()}
function fitV(){V.k=K0;V.x=0;V.y=0;redraw()}
function mids(){var a=Object.keys(ptrs).map(function(k){return ptrs[k]}),p=a[0],q=a[1]||a[0];return{x:(p[0]+q[0])/2,y:(p[1]+q[1])/2,d:Math.hypot(p[0]-q[0],p[1]-q[1])||1}}
function startG(){var m=mids(),r=cv.getBoundingClientRect();gest={d:m.d,k:V.k,px:(m.x-r.left-V.x)/V.k,py:(m.y-r.top-V.y)/V.k}}
function moveG(){var m=mids(),r=cv.getBoundingClientRect();V.k=Math.min(Math.max(gest.k*m.d/gest.d,K0*0.5),K0*8);V.x=m.x-r.left-gest.px*V.k;V.y=m.y-r.top-gest.py*V.k;clampV();redraw()}
function toast(t){var e=document.getElementById('tt');if(!e)return;e.textContent=t;e.style.opacity=1;setTimeout(function(){e.style.opacity=0},1000)}
function toEraser(){if(!cur||cur.er)return;var i=strokes.indexOf(cur);if(i>-1)strokes.splice(i,1);snap=null;cur={er:1,id:cur.id,pt:cur.pt};redraw();toast('🧽 Silgi: sürükleyerek sil')}
function initCanvas(){
 if(!ed)return;
 cv=document.getElementById('cv');ov=document.getElementById('ov');var w=cv.parentNode;DPR=Math.min(window.devicePixelRatio||1,2);
 CW=w.clientWidth;CH=w.clientHeight;cv.width=ov.width=CW*DPR;cv.height=ov.height=CH*DPR;ctx=cv.getContext('2d');octx=ov.getContext('2d');
 K0=CW/PW;if(V.cw!==CW){V.k=K0;V.x=0;V.y=0;V.cw=CW}
 redraw();ptrs={};gest=null;cur=null;
 function pt(e){var r=cv.getBoundingClientRect();return[(e.clientX-r.left-V.x)/V.k,(e.clientY-r.top-V.y)/V.k,e.pressure>0?e.pressure:0.5]}
 ['contextmenu','selectstart','touchstart'].forEach(function(n){cv.addEventListener(n,function(e){e.preventDefault()},{passive:false})});
 cv.addEventListener('pointerdown',function(e){
  e.preventDefault();cv.setPointerCapture(e.pointerId);
  if(e.pointerType==='pen'){penSeen=true;lastPen=Date.now()}
  if(e.pointerType==='touch'){
   if((cur&&cur.pt==='pen')||Date.now()-lastPen<1000)return;
   ptrs[e.pointerId]=[e.clientX,e.clientY];
   if(Object.keys(ptrs).length>=2||penSeen||pen.only){
    if(cur&&!cur.er){var ix=strokes.indexOf(cur);if(ix>-1)strokes.splice(ix,1)}
    clearTimeout(hold);cur=null;startG();redraw();return}
  }
  var q=pt(e);
  if(pen.t==='er'){cur={er:1,id:e.pointerId,pt:e.pointerType};erase(q);return}
  cur={t:pen.t,c:pen.c,w:pen.w*2,p:[q],id:e.pointerId,pt:e.pointerType,sx:e.clientX,sy:e.clientY};strokes.push(cur);
  if(TOOLS[cur.t].f){ov.style.opacity=TOOLS[cur.t].a;full(cur,octx)}else seg(cur,0);
  clearTimeout(hold);hold=setTimeout(toEraser,600);
 });
 cv.addEventListener('pointermove',function(e){
  e.preventDefault();
  if(e.pointerType==='pen')lastPen=Date.now();
  if(e.pointerType==='touch'&&ptrs[e.pointerId]){ptrs[e.pointerId]=[e.clientX,e.clientY];if(gest){moveG();return}}
  if(!cur||e.pointerId!==cur.id)return;
  if(hold&&cur.sx!=null&&Math.hypot(e.clientX-cur.sx,e.clientY-cur.sy)>10){clearTimeout(hold);hold=null}
  var ev=e.getCoalescedEvents?e.getCoalescedEvents():[e];if(!ev.length)ev=[e];
  ev.forEach(function(x){var r=pt(x);
   if(cur.er){erase(r);return}
   var l=cur.p[cur.p.length-1],dx=r[0]-l[0],dy=r[1]-l[1];if(dx*dx+dy*dy<0.5)return;
   cur.p.push([l[0]+dx*0.6,l[1]+dy*0.6,l[2]+(r[2]-l[2])*0.5]);
   if(TOOLS[cur.t].f){ovClear();full(cur,octx)}else seg(cur,cur.p.length-1);
  });
 });
 function end(e){
  delete ptrs[e.pointerId];clearTimeout(hold);var n=Object.keys(ptrs).length;
  if(!n||(n<2&&!penSeen&&!pen.only))gest=null;else if(gest)startG();
  if(cur&&cur.id===e.pointerId){if(!cur.er&&cur.p.length>1){if(TOOLS[cur.t].f)redraw();else tail(cur)}cur=null}
 }
 cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
}
function exportPage(P){
 var b=300;P.s.forEach(function(s){s.p.forEach(function(p){if(p[1]+60>b)b=p[1]+60})});b=Math.min(PH,b);
 var c=document.createElement('canvas'),m=1.25;c.width=PW*m;c.height=b*m;
 var o=ctx,os=strokes,op=pen.paper;ctx=c.getContext('2d');strokes=P.s;pen.paper=P.p;ctx.setTransform(m,0,0,m,0,0);drawAll();
 var d=c.toDataURL('image/jpeg',0.7);ctx=o;strokes=os;pen.paper=op;return d;
}
function curPage(){pages[pi]={s:strokes,p:pen.paper}}
function saveNote(){
 curPage();
 var pg=pages.filter(function(p){return p.s.length});
 if(!pg.length){closeM();alert('Önce bir şeyler yaz.');return}
 var imgs=pg.map(exportPage);S.notes=S.notes||[];var n=null,old=null;
 if(editIdx>=0){n=S.notes[editIdx];old=n.imgs;n.imgs=(n.imgs||[n.img]).concat(imgs)}
 else S.notes.unshift({t:Date.now(),title:(ntv||'').trim()||'Başlıksız',cat:ncat,cov:ncov,emo:nemo,ci:ncimg,img:imgs[0],imgs:imgs});
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(n)n.imgs=old;else S.notes.shift();alert('Depolama dolu, eski notlardan sil.');return}
 strokes=[];pages=[];pi=0;editIdx=-1;ntv='';ncimg='';ed=false;closeM();render();
}
function goPage(d){var k=pi+d;if(k<0||k>=pages.length)return;curPage();pi=k;strokes=pages[k].s;pen.paper=pages[k].p;V.cw=0;rr()}
function addPage(){curPage();pages.push({s:[],p:pen.paper});pi=pages.length-1;strokes=pages[pi].s;V.cw=0;rr()}
function addToNote(i){closeM();ed=true;editIdx=i;pages=[{s:[],p:pen.paper}];pi=0;strokes=pages[0].s;V.cw=0;render()}
function openNote(i){var n=S.notes[i],im=(n.imgs||[n.img]).map(function(u,k){return'<div class="mut" style="margin-top:8px">Sayfa '+(k+1)+'</div><img class="nimg" src="'+u+'">'}).join('');document.getElementById('modal').innerHTML='<div class="sheet"><div class="box"><h2>'+esc((n.emo||'')+' '+n.title)+'</h2>'+im+'<button class="big" style="margin-top:10px" onclick="addToNote('+i+')">＋ Sayfa ekle</button><div class="mut" style="margin-top:10px">Kapağı değiştir</div>'+coverUI(i)+'<div class="row" style="margin-top:10px"><button class="ghost big" onclick="closeM()">Kapat</button><button class="ghost big" style="color:var(--red)" onclick="delNote('+i+')">Sil</button></div></div></div>'}
function delNote(i){if(!confirm('Bu not silinsin mi?'))return;S.notes.splice(i,1);save();closeM();render()}
document.addEventListener('gesturestart',function(e){e.preventDefault()});
window.addEventListener('orientationchange',function(){setTimeout(function(){if(tab==='notes')render()},300)});
setInterval(function(){var el=document.getElementById('t');if(el&&S.run)el.textContent=fmt(elapsed())},500);
render();
</script>
